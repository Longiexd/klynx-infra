events {
    worker_connections 1024;
}

http {

    # ============================================================
    # ODOO APPLICATIONS
    # ============================================================

    upstream odoo_client01 {
        server odoo_client01:8069;
    }

    upstream odoo_client02 {
        server odoo_client02:8069;
    }

    upstream odoo_carrental {
        server odoo_carrental:8069;
    }


    # ============================================================
    # ODOO LONGPOLLING / LIVECHAT
    # ============================================================

    upstream odoo_client01_poll {
        server odoo_client01:8072;
    }

    upstream odoo_client02_poll {
        server odoo_client02:8072;
    }

    upstream odoo_carrental_poll {
        server odoo_carrental:8072;
    }


    # ============================================================
    # KLYNX RENTAL OS
    # ============================================================

    upstream rental_os_frontend {
        server frontend:3000;
    }

    upstream rental_os_api {
        server backend:8000;
    }


    # ============================================================
    # CLIENT 01
    # ============================================================

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name client01.example.com;

        return 301 https://$host$request_uri;
    }

    # HTTPS Reverse Proxy
    server {
        listen 443 ssl http2;
        server_name client01.example.com;

        # SSL certificates
        ssl_certificate     /etc/nginx/ssl/client01.crt;
        ssl_certificate_key /etc/nginx/ssl/client01.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # Recommended timeouts for Odoo
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;

        # Maximum upload size
        client_max_body_size 500M;

        # Main Odoo application
        location / {

            proxy_pass http://odoo_client01;
            proxy_redirect off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Preserve client IP behind Cloudflare
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        }

        # Longpolling endpoint
        location /longpolling {

            proxy_pass http://odoo_client01_poll;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }


    # ============================================================
    # CLIENT 02
    # ============================================================

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name client02.example.com;

        return 301 https://$host$request_uri;
    }

    # HTTPS Reverse Proxy
    server {
        listen 443 ssl http2;
        server_name client02.example.com;

        # SSL certificates
        ssl_certificate     /etc/nginx/ssl/client02.crt;
        ssl_certificate_key /etc/nginx/ssl/client02.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;

        client_max_body_size 500M;

        # Main Odoo application
        location / {

            proxy_pass http://odoo_client02;
            proxy_redirect off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Preserve client IP behind Cloudflare
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        }

        # Longpolling endpoint
        location /longpolling {

            proxy_pass http://odoo_client02_poll;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }


    # ============================================================
    # CAR RENTAL ODOO DEMO
    # ============================================================

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name carrental.example.com;

        return 301 https://$host$request_uri;
    }

    # HTTPS Reverse Proxy
    server {
        listen 443 ssl http2;
        server_name carrental.example.com;

        # SSL certificates
        ssl_certificate     /etc/nginx/ssl/carrental.crt;
        ssl_certificate_key /etc/nginx/ssl/carrental.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;

        client_max_body_size 500M;

        # Main Odoo application
        location / {

            proxy_pass http://odoo_carrental;
            proxy_redirect off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Preserve client IP behind Cloudflare
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        }

        # Longpolling endpoint
        location /longpolling {

            proxy_pass http://odoo_carrental_poll;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }


    # ============================================================
    # KLYNX RENTAL OS FRONTEND
    # ============================================================

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name rental-os.example.com;

        return 301 https://$host$request_uri;
    }

    # HTTPS Reverse Proxy
    server {
        listen 443 ssl http2;
        server_name rental-os.example.com;

        # SSL certificates
        ssl_certificate     /etc/nginx/ssl/rental-os.crt;
        ssl_certificate_key /etc/nginx/ssl/rental-os.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # Next.js / WebSocket support
        location / {

            proxy_pass http://rental_os_frontend;
            proxy_redirect off;

            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Preserve client IP behind Cloudflare
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        }
    }


    # ============================================================
    # KLYNX RENTAL OS API
    # ============================================================

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name api.rental-os.example.com;

        return 301 https://$host$request_uri;
    }

    # HTTPS Reverse Proxy
    server {
        listen 443 ssl http2;
        server_name api.rental-os.example.com;

        # SSL certificates
        ssl_certificate     /etc/nginx/ssl/api-rental-os.crt;
        ssl_certificate_key /etc/nginx/ssl/api-rental-os.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # FastAPI reverse proxy
        location / {

            proxy_pass http://rental_os_api;
            proxy_redirect off;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Preserve client IP behind Cloudflare
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        }
    }
}
